name: Tests et publication Hugging Face

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/engine.test.js tests/woo.test.js tests/shopify.test.js
      - run: python3 -m unittest discover -s tests -p "relais_test.py"
      - run: node --test tests/relais-cloudflare.test.mjs

  publier:
    # Publie index.html (accueil), app.html (outil), prospection.html (audit en série, page interne), mentions-legales.html, cgv.html, engine.js, woo.js et shopify.js sur le Space, uniquement depuis main et si les tests passent.
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub==0.26.2
      - name: Adresse du relais de l'audit express
        # Variable de dépôt RELAIS_URL (ex. https://waypilot-relais.xxx.workers.dev) : remplace l'adresse écrite dans app.html.
        env:
          RELAIS_URL: ${{ vars.RELAIS_URL }}
        run: |
          if [ -n "$RELAIS_URL" ]; then
            sed -i "s#const RELAY_URL = \"[^\"]*\";#const RELAY_URL = \"${RELAIS_URL%/}\";#" app.html prospection.html
            grep -n "const RELAY_URL" app.html prospection.html
          fi
      - name: Envoyer les fichiers sur le Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: waypilot/waypilot
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Secret HF_TOKEN absent. Ajoutez un jeton Hugging Face (droit d'écriture) dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          python - <<'PY'
          import os
          from huggingface_hub import HfApi, CommitOperationAdd

          # Un seul commit pour tous les fichiers : la page ne fonctionne pas sans engine.js et woo.js.
          HfApi(token=os.environ["HF_TOKEN"]).create_commit(
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              operations=[CommitOperationAdd(path_in_repo=f, path_or_fileobj=f) for f in ("index.html", "app.html", "prospection.html", "mentions-legales.html", "cgv.html", "engine.js", "woo.js", "shopify.js")],
              commit_message=f"Publication depuis GitHub ({os.environ['GITHUB_SHA'][:7]})",
          )
          print("Space mis à jour.")
          PY
      - name: Publier le relais de l'audit express (Space Docker waypilot/relais)
        # Les Spaces Docker exigent un abonnement Hugging Face PRO : étape activée seulement si la variable PUBLIER_RELAIS_HF vaut « oui ».
        if: vars.PUBLIER_RELAIS_HF == 'oui'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.create_repo("waypilot/relais", repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(repo_id="waypilot/relais", repo_type="space", folder_path="relais",
                            commit_message=f"Relais depuis GitHub ({os.environ['GITHUB_SHA'][:7]})")
          print("Relais mis à jour : https://waypilot-relais.hf.space")
          PY

  relais-cloudflare:
    # Déploie relais-cloudflare/worker.js sur Cloudflare Workers et le site sur Cloudflare Pages (gratuit), si les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID existent.
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les secrets Cloudflare
        id: secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then echo "ok=oui" >> "$GITHUB_OUTPUT"; else echo "Secrets Cloudflare absents : relais non déployé."; fi
      - name: Stockage des rapports en ligne (KV)
        if: steps.secrets.outputs.ok == 'oui'
        # Crée le stockage KV au premier passage et l'ajoute à wrangler.toml. En cas d'échec (droits du jeton), le relais est déployé sans : seuls les liens de rapport sont indisponibles.
        continue-on-error: true
        working-directory: relais-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          find_id() { npx --yes wrangler@3.90.0 kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const n=JSON.parse(s).find(x=>x.title.endsWith("RAPPORTS"));process.stdout.write(n?n.id:"")})'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx --yes wrangler@3.90.0 kv namespace create RAPPORTS; ID=$(find_id); fi
          test -n "$ID"
          printf '\n[[kv_namespaces]]\nbinding = "RAPPORTS"\nid = "%s"\n' "$ID" >> wrangler.toml
          echo "Stockage des rapports : $ID"
      - name: Déployer le relais
        if: steps.secrets.outputs.ok == 'oui'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relais-cloudflare
          command: deploy
      - name: Préparer le site
        if: steps.secrets.outputs.ok == 'oui'
        run: |
          mkdir -p site
          cp index.html app.html prospection.html mentions-legales.html cgv.html engine.js woo.js shopify.js site/
      - name: Créer le projet Pages au premier passage
        if: steps.secrets.outputs.ok == 'oui'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Échoue sans effet si le projet existe déjà.
        run: npx --yes wrangler@3.90.0 pages project create waypilot --production-branch=main || true
      - name: Publier le site sur Cloudflare Pages (projet waypilot)
        if: steps.secrets.outputs.ok == 'oui'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=waypilot --branch=main --commit-dirty=true
